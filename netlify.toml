# Netlify 建置與資安設定 / Netlify build and security settings

[build]
  command = "npm run build"   # 會先自動執行 prebuild（資料檢查）/ runs prebuild (data check) first
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 所有頁面的資安標頭 / Security headers for every page
# 修改 CSP 時，請同步檢查 src/lib/security.ts（GitHub Pages 備用的 <meta> 版本）
# When changing the CSP, also check src/lib/security.ts (the <meta> fallback for GitHub Pages)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"

# Astro 產生的檔案名稱帶有雜湊值，內容變更時檔名也會變，可以長期快取
# Astro's hashed asset filenames change with content, so they can be cached long-term
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

name: Sync CISA KEV

# 每小時檢查一次 CISA 已遭利用漏洞清單，有變動才提交到 data 分支（不會部署）；publish-data 流程每週一、三、五把 data 合併到 main 才部署。
# Checks CISA's KEV catalog hourly and commits to the data branch only when it changed (no deploy); the publish-data workflow merges data into main on Mondays, Wednesdays and Fridays, and that is what deploys.
on:
  schedule:
    - cron: '17 * * * *'   # 每小時第 17 分（避開整點尖峰）/ minute 17 of every hour, off the busy top of the hour
  workflow_dispatch:

# 只有這個流程需要寫入權限 / Only this workflow needs write access
permissions:
  contents: write

# 與其他資料同步流程共用同一組，避免同時推送到 data 分支 / Shared with the other data workflows so they never push to data at the same time
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Switch to the data branch
        run: bash scripts/ci/checkout-data.sh
      - name: Fetch KEV
        run: node scripts/fetch-kev.mjs
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Commit to data if changed
        run: bash scripts/ci/push-data.sh "Sync CISA KEV" src/data/kev.json

name: Sync data feeds

# 每天台灣時間 08:00–17:00 每小時整點，同步 GitHub 套件漏洞公告與 endoflife.date 版本資料。
# 有變動才提交；Netlify 會因為這次提交自動重新部署。GitHub 的排程可能延遲幾分鐘到半小時。
# Every hour on the hour, 08:00–17:00 Taiwan time, sync GitHub advisories and endoflife.date versions.
# Commits only when something changed; Netlify redeploys on that commit. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: '0 0-9 * * *'   # UTC 00–09 = 台灣時間 08–17 / UTC 00–09 = 08–17 Taiwan time (UTC+8)
  workflow_dispatch:

# 只有這個流程需要寫入權限 / Only this workflow needs write access
permissions:
  contents: write

concurrency:
  group: feeds-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 單一來源失敗不影響另一個；失敗時保留原本的資料檔
      # One source failing doesn't block the other; on failure the existing file is kept
      - name: Fetch GitHub advisories
        id: ghsa
        continue-on-error: true
        run: node scripts/fetch-ghsa.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch endoflife.date
        id: eol
        continue-on-error: true
        run: node scripts/fetch-eol.mjs
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/ghsa.json src/data/eol.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/ghsa.json src/data/eol.json
            git commit -m "Sync data feeds"
            git pull --rebase
            git push
          fi
      # 有來源失敗時讓這次執行顯示為失敗，GitHub 會寄通知
      # Mark the run failed when a source failed, so GitHub sends a notification
      - name: Report failed sources
        if: steps.ghsa.outcome == 'failure' || steps.eol.outcome == 'failure'
        run: |
          echo "GHSA: ${{ steps.ghsa.outcome }}, endoflife.date: ${{ steps.eol.outcome }}"
          exit 1

name: Sync data feeds

# 每天台灣時間 08:00–17:00 每小時整點，同步 GitHub 套件漏洞公告與 endoflife.date 版本資料。
# 有變動才提交到 data 分支（不會部署）；publish-data 流程每週一、三、五把 data 合併到 main 才部署。GitHub 的排程可能延遲幾分鐘到半小時。
# Every hour on the hour, 08:00–17:00 Taiwan time, sync GitHub advisories and endoflife.date versions.
# Commits to the data branch only when something changed (no deploy); the publish-data workflow merges data into main on Mondays, Wednesdays and Fridays, and that is what deploys. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: '0 0-9 * * *'   # UTC 00–09 = 台灣時間 08–17 / UTC 00–09 = 08–17 Taiwan time (UTC+8)
  workflow_dispatch:

# 只有這個流程需要寫入權限 / Only this workflow needs write access
permissions:
  contents: write

# 與其他資料同步流程共用同一組，避免同時推送到 data 分支 / Shared with the other data workflows so they never push to data at the same time
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Switch to the data branch
        run: bash scripts/ci/checkout-data.sh
      # 單一來源失敗不影響另一個；失敗時保留原本的資料檔
      # One source failing doesn't block the other; on failure the existing file is kept
      - name: Fetch GitHub advisories
        id: ghsa
        continue-on-error: true
        run: node scripts/fetch-ghsa.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch endoflife.date
        id: eol
        continue-on-error: true
        run: node scripts/fetch-eol.mjs
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Commit to data if changed
        run: bash scripts/ci/push-data.sh "Sync data feeds" src/data/ghsa.json src/data/eol.json
      # 有來源失敗時讓這次執行顯示為失敗，GitHub 會寄通知
      # Mark the run failed when a source failed, so GitHub sends a notification
      - name: Report failed sources
        if: steps.ghsa.outcome == 'failure' || steps.eol.outcome == 'failure'
        run: |
          echo "GHSA: ${{ steps.ghsa.outcome }}, endoflife.date: ${{ steps.eol.outcome }}"
          exit 1

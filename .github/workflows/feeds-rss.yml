name: Sync RSS feeds

# 每天台灣時間 08:00、12:00、17:00 同步技術動態的 RSS 來源（含週末）。有變動才提交到 data 分支（不會部署）；
# publish-data 流程在週一、三、五 17:30 把 data 合併到 main 才部署。GitHub 的排程可能延遲幾分鐘到半小時。
# Sync the RSS sources for the dev feeds page at 08:00, 12:00 and 17:00 Taiwan time, weekends included.
# Commits to the data branch only when something changed (no deploy); the publish-data workflow merges data into main on Mondays, Wednesdays and Fridays at 17:30, and that is what deploys. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: '0 0,4,9 * * *'   # UTC 00:00、04:00、09:00 = 台灣時間 08:00、12:00、17:00 / = 08:00, 12:00, 17:00 Taiwan time (UTC+8)
  workflow_dispatch:

# 只有這個流程需要寫入權限 / Only this workflow needs write access
permissions:
  contents: write

# 與其他資料同步流程共用同一組，避免同時推送到 data 分支 / Shared with the other data workflows so they never push to data at the same time
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Switch to the data branch
        run: bash scripts/ci/checkout-data.sh
      # 超過三分之一的來源失敗時腳本會回報失敗，但資料已寫入，所以仍先提交再回報
      # The script fails when over a third of the sources fail, but the data is already written, so commit first and report after
      - name: Fetch RSS feeds
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-feeds.mjs
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Commit to data if changed
        run: bash scripts/ci/push-data.sh "Sync RSS feeds" src/data/feeds.json
      - name: Report failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Too many feed sources failed; see the 'Fetch RSS feeds' step."
          exit 1

name: Sync RSS feeds

# 每天台灣時間 08:00、12:00、17:00 同步技術動態的 RSS 來源（含週末）。有變動才提交；Netlify 會因為這次提交自動重新部署。
# GitHub 的排程可能延遲幾分鐘到半小時。
# Sync the RSS sources for the dev feeds page at 08:00, 12:00 and 17:00 Taiwan time, weekends included.
# Commits only when something changed; Netlify redeploys on that commit. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: '0 0,4,9 * * *'   # UTC 00:00、04:00、09:00 = 台灣時間 08:00、12:00、17:00 / = 08:00, 12:00, 17:00 Taiwan time (UTC+8)
  workflow_dispatch:

# 只有這個流程需要寫入權限 / Only this workflow needs write access
permissions:
  contents: write

concurrency:
  group: feeds-rss
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 超過三分之一的來源失敗時腳本會回報失敗，但資料已寫入，所以仍先提交再回報
      # The script fails when over a third of the sources fail, but the data is already written, so commit first and report after
      - name: Fetch RSS feeds
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-feeds.mjs
      - name: Validate data
        run: node scripts/validate-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/feeds.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/feeds.json
            git commit -m "Sync RSS feeds"
            git pull --rebase
            git push
          fi
      - name: Report failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Too many feed sources failed; see the 'Fetch RSS feeds' step."
          exit 1

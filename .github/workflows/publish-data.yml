name: Publish data

# 自動同步的資料先累積在 data 分支（不會部署）。這個流程每週一、三、五 17:30（台灣時間）把 data 合併到 main，合併後才會部署。
# 為什麼不是每天：Netlify 免費版每月 300 點、每次正式部署 15 點，也就是每月只有約 20 次部署。
# 週一、三、五每月約 12–14 次，剩下約 6–8 次留給功能分支的合併。想調整頻率時改下面的 cron。
# Automatic syncs pile up on the data branch (which doesn't deploy). This workflow merges data into main on Mondays, Wednesdays and Fridays at 17:30 Taiwan time, and that is what deploys.
# Why not daily: Netlify's free plan gives 300 credits a month at 15 per production deploy, about 20 deploys.
# Mon/Wed/Fri is 12 to 14 a month, leaving about 6 to 8 for merging feature branches. Change the cron below to adjust.
on:
  schedule:
    - cron: '30 9 * * 1,3,5'   # UTC 09:30 週一、三、五 = 台灣時間 17:30 / UTC 09:30 on Mon, Wed, Fri = 17:30 Taiwan time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

# 與各資料同步流程共用同一組，避免同時推送 / Shares one group with the data syncs so they never push at the same time
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge data into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data || { echo "No data branch yet; nothing to publish."; exit 0; }
          # data 的內容都已經在 main 裡，不需要發佈 / everything on data is already in main
          if git merge-base --is-ancestor origin/data origin/main; then
            echo "Nothing to publish."
            exit 0
          fi
          # 合併失敗（衝突）時讓這次執行失敗，GitHub 會寄通知 / a conflict fails the run so GitHub sends a notification
          git merge --no-ff --no-edit -m "Publish data updates" origin/data
          node scripts/validate-data.mjs
          git push origin main
